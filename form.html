<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма — Снаряжение рядом · V35</title>
    <link rel="stylesheet" href="style.css">
    <script src="form.js" defer></script>
</head>
<body>
    <header>
        <h1>Снаряжение рядом · V35</h1> <!-- название приложения -->
        <nav>  <!-- ссылка на каталог -->
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
        </nav> 
    </header>
    <main class="page">
        <h2>Заявка на прокат</h2> <!-- заголовок главной -->
        <p>Учебная форма. Данные пока не сохраняются.</p> <!-- короткое пояснение -->
        <form class="request-form" method="get" novalidate>
            <p class="form-field">
                <label for="item">Товар</label>
                <select id="item" name="item" required>
                    <option value=""> </option>
                    <option value="kovrik">Коврик</option>
                    <option value="lighter">Фонарь</option>
                    <option value="backpack">Рюкзак</option>
                    <option value="Cosmic">Космические шахматы</option>
                </select>
            </p>
            <p class="form-field">
                <label for="quantity">Количество единиц</label>
                <input id="quantity" name="quantity" type="number"
                        min="1" step="1" value="3" required>
            </p>
            <p class="form-field"></p>
                <label for="notes">Комментарий к заказу</label>
                <textarea id="notes" name="notes" rows="4"
                            placeholder="Например, удобный день доставки"></textarea>
            </p>
            <div class="form-field">
                <input id="level" name="level" type="range", min="1" max="5" step="1" value="3">
                <text>
                    <p>1 день</p>
                    <p>5 дней</p>
                </text>
            </div>
            <p>
                <input id="extra1" name="extra1" type="checkbox" value="yes" checked>
                <label for="extra1">Нужна инструкция</label>
            </p>
            <p>
                <input id="extra2" name="extra2" type="checkbox" v  alue="yes">
                <label for="extra2">Нужна упаковка</label>
            </p>
            <p id="status" role="status"></p>
            <button type="submit">Проверить заказ</button>
            <p id="result" role="status" aria-live="polite"></p>
        </form>
        <p><a href="index.html">Назад</a></p>
    </main>
</body>
<footer>
    <p>Учебный прототип · Вариант 35</p>
</footer>
</html>
